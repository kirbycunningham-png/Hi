<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | Ascendify</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap");
        html { background: rgb(16,0,32); height: 100%; margin: 0; padding: 0; }
        body { font-family: "Space Grotesk", sans-serif !important; background: rgb(16,0,32); color: white; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; select-none: none; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .container { animation: fadeIn 0.3s; max-width: 600px; padding: 20px; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/static/icon.png">
</head>
<body>
    <div class="container space-y-6">
        <i class="fa-solid fa-exclamation-triangle text-purple-400 text-8xl mb-4"></i>
        <h1 class="text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-purple-600">404</h1>
        <h2 class="text-3xl font-semibold text-purple-300">Page Not Found</h2>
        <p class="text-xl text-purple-200/80">Oops! The page you're looking for doesn't exist. It might have been moved or deleted.</p>
        <a href="/">
            <button class="bg-purple-600 rounded-lg font-semibold text-white px-8 py-3 transition-all hover:bg-purple-700 hover:-translate-y-1">Go Back Home</button>
        </a>
    </div>
</body>
</html>
