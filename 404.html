<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Ascendify</title>

    <!-- Favicon added -->
    <link rel="icon" type="image/png" href="/static/icon.png">

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap");
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: rgb(16,0,32);
            font-family: "Space Grotesk", sans-serif;
            color: white;
            overflow: hidden;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }
        .icon {
            font-size: 120px;
            color: #a855f7; /* purple-500 */
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }
        h1 {
            font-size: 9rem;
            font-weight: 700;
            margin: 0;
            line-height: 0.9;
            background: linear-gradient(to right, #c084fc, #a855f7, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        h2 {
            font-size: 2.5rem;
            color: #d8b4fe; /* purple-300 */
            margin: 20px 0 16px;
        }
        p {
            font-size: 1.3rem;
            color: #c4b5fd; /* purple-200 */
            max-width: 500px;
            margin: 0 auto 32px;
        }
        .home-btn {
            background: #7c3aed; /* purple-600 */
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 16px 40px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.3);
        }
        .home-btn:hover {
            background: #9333ea; /* purple-700 */
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(124, 58, 237, 0.5);
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <i class="fa-solid fa-exclamation-triangle icon"></i>
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>Looks like this page got lost in the void...</p>
        <a href="/" class="home-btn">Go Back Home</a>
    </div>
</body>
</html>
