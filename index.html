<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Marketplace Chat</title>

  <!-- TalkJS -->
  <script>
    (function(t,a,l,k,j,s){
      s=a.createElement('script');s.async=1;s.src="https://cdn.talkjs.com/talk.js";
      a.head.appendChild(s);k=t.Promise;
      t.Talk={v:3,ready:{then:function(f){if(k)return new k(function(r,e){l.push([f,r,e])});l.push([f])},catch:function(){return k&&new k()},c:l}};
    })(window,document,[]);
  </script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #1e1f22;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #chat {
      height: 100vh;
      width: 100vw;
    }

    /* ===== Discord / Eldorado Look ===== */

    /* Sidebar */
    .t-conversation-list {
      background: #2b2d31 !important;
      border-right: none !important;
    }

    /* Main chat area */
    .t-chatbox {
      background: #313338 !important;
    }

    /* Hide names (avatar + text only) */
    .t-message-author {
      display: none !important;
    }

    /* Message spacing */
    .t-message {
      padding: 4px 0 !important;
    }

    /* Message bubbles stretched */
    .t-message-body {
      max-width: 85% !important;
      background: transparent !important;
      color: #dbdee1 !important;
      font-size: 15px;
      line-height: 1.4;
    }

    /* Input area */
    .t-composer {
      background: #383a40 !important;
      border-top: none !important;
    }

    .t-composer textarea {
      background: #1e1f22 !important;
      color: #fff !important;
      border-radius: 6px !important;
    }

    /* Remove headers */
    .t-chatbox-header {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="chat"></div>

  <script>
    Talk.ready.then(function () {

      const me = new Talk.User({
        id: "buyer_1",
        name: "Buyer",
        email: "buyer@test.com",
        photoUrl: "https://i.pravatar.cc/100?img=3",
        role: "buyer"
      });

      const seller = new Talk.User({
        id: "seller_1",
        name: "Seller",
        email: "seller@test.com",
        photoUrl: "https://i.pravatar.cc/100?img=5",
        role: "seller"
      });

      const session = new Talk.Session({
        appId: "tRkW5nYP", // your app id
        me: me
      });

      const conversation = session.getOrCreateConversation(
        Talk.oneOnOneId(me, seller)
      );

      conversation.setParticipant(me);
      conversation.setParticipant(seller);

      const chatbox = session.createChatbox(conversation);
      chatbox.mount(document.getElementById("chat"));
    });
  </script>
</body>
</html>
